<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
  <title>Acesso restrito</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090b10;color:#f5f6fa;font:15px system-ui}.box{width:min(420px,calc(100% - 32px));padding:30px;background:#121620;border:1px solid #29303d;border-radius:16px}h1{font-size:24px;margin:0 0 7px}p{color:#a7b0be;margin:0 0 22px}label{display:block;margin:13px 0 6px;font-weight:700}input{width:100%;height:46px;border-radius:10px;border:1px solid #303847;background:#0b0e14;color:white;padding:0 12px;font:inherit}button{width:100%;height:46px;margin-top:20px;border:0;border-radius:10px;background:#d84d79;color:white;font-weight:800;cursor:pointer}.errorlist{list-style:none;padding:10px 12px;margin:0 0 10px;border-radius:9px;background:#401d25;color:#ffb6c0}
  </style>
</head>
<body>
  <main class="box">
    <h1>Acesso restrito</h1>
    <p>Entre com a conta autorizada da equipe.</p>
    <form method="post" autocomplete="on">
      {% csrf_token %}<input type="hidden" name="next" value="{{ next }}">
      {{ form.non_field_errors }}
      <label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>{{ form.email }}
      <label for="{{ form.password.id_for_label }}">{{ form.password.label }}</label>{{ form.password }}
      <button type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
