# Blueprint de deploy no Render (https://render.com/docs/blueprint-spec).
#
# PRODUCAO — rendaerenda.com.br (modelo intermediario simples)
# Sobe: Postgres + Web + 2 Cron Jobs.
#
# Variaveis sync:false = so o ESSENCIAL pra subir e vender:
#   Asaas (split) + Melhor Envio (cotacao frete) + e-mail + S3 (fotos).
# KYC/SMS/NFS-e/Correios ficam opcionais (defaults vazios no settings).
#
# Como usar:
#   1. Push deste arquivo.
#   2. Render → New → Blueprint → Apply.
#   3. Preencha as poucas chaves pedidas (ou deixe em branco e complete depois).
#   4. Hostinger DNS: A @ → 216.24.57.1 ; CNAME www → rendaerenda-web.onrender.com

databases:
  - name: rendaerenda-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: rendaerenda
    user: rendaerenda
    ipAllowList: []

envVarGroups:
  - name: rendaerenda-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "rendaerenda.com.br,www.rendaerenda.com.br,.onrender.com"
      - key: SITE_NAME
        value: "Renda & Renda"
      - key: SITE_DOMAIN
        value: "rendaerenda.com.br"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://rendaerenda.com.br,https://www.rendaerenda.com.br"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PLATFORM_COMMISSION_PERCENT
        value: "30"
      - key: PACKAGING_FEE
        value: "0"
      - key: AUTO_PAYOUT_ON_PAYMENT
        value: "True"
      - key: REQUIRE_SELLER_KYC
        value: "False"
      - key: WALLET_RELEASE_DAYS_AFTER_SHIPPING
        value: "0"
      - key: DELIVERY_CONFIRMATION_WINDOW_HOURS
        value: "24"
      - key: SHIPPING_PROVIDER
        value: "melhor_envio"
      - key: MELHOR_ENVIO_SANDBOX
        value: "False"
      - key: PAYMENT_PROVIDER
        value: "asaas"
      - key: ASAAS_API_URL
        value: "https://api.asaas.com/v3"
      # pf = sem split (repasse Pix); trocar para "pj" quando tiver CNPJ + subcontas
      - key: ASAAS_ACCOUNT_TYPE
        value: "pf"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "Renda & Renda <no-reply@rendaerenda.com.br>"
      - key: AWS_S3_SIGNED_URL_EXPIRE_SECONDS
        value: "300"

services:
  - type: web
    name: rendaerenda-web
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    healthCheckPath: /healthz/
    domains:
      - rendaerenda.com.br
      - www.rendaerenda.com.br
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      # --- Essenciais ---
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false

  - type: cron
    name: rendaerenda-poll-shipments
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py poll_shipments"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      - key: MELHOR_ENVIO_TOKEN
        sync: false

  - type: cron
    name: rendaerenda-release-deliveries
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "*/30 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py release_deliveries"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
