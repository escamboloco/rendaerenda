# Blueprint de deploy no Render (https://render.com/docs/blueprint-spec).
#
# MODO TESTE - CUSTO ZERO: so o servico "web", no plano free (`plan: free`).
# Sem Redis (cache/rate-limit usam o proprio Postgres) e sem worker Celery
# 24/7 (tasks assincronas do checkout rodam sincronas no mesmo processo
# do gunicorn via CELERY_TASK_ALWAYS_EAGER - ver config/settings.py). Os
# Render Cron Jobs das tarefas periodicas (rastreio de envio + liberacao
# de saldo) foram REMOVIDOS deste blueprint por enquanto - mesmo custando
# centavos, o pedido foi custo zero enquanto o site ainda e so teste. Pra
# reativar antes de ir ao ar: ver os dois blocos `type: cron` no historico
# do git (commit "Corrigir CSP do Alpine.js e reduzir custo de hospedagem")
# e o management command correspondente em apps/shipping/management/.
#
# O plano free do Render: dorme apos ~15 min sem trafego (primeiro acesso
# depois disso demora uns 30-50s pra acordar) e tem 512MB RAM/CPU
# compartilhada - inaceitavel pra checkout de verdade com webhook de
# pagamento, mas ok pra testar o site. Antes de abrir pro publico, trocar
# `plan: free` por `plan: starter` no servico web e reativar os cron jobs.
#
# Depois do primeiro deploy, va no dashboard do servico "web" e preencha as
# variaveis marcadas com `sync: false` abaixo (segredos - nunca comitar no
# repo). Ver docs/BASE_JURIDICA.md para o que cada uma controla.
#
# IMPORTANTE sobre envVarGroups: o grupo abaixo (rendaerenda-shared) so pode
# conter valores LITERAIS ou `generateValue: true` - o Render nao aceita
# `sync: false`, `fromDatabase` nem `fromService` dentro de um grupo (e
# YAML nao tem como "espalhar" uma lista dentro da outra via ancora, entao
# nao da pra fatorar isso com &anchor/*alias). Por isso os segredos (API
# keys, tokens, credenciais) aparecem repetidos em CADA servico que precisa
# deles, em vez de ficarem so no grupo.

envVarGroups:
  - name: rendaerenda-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SITE_NAME
        value: "Renda & Renda"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com" # trocar pelo dominio custom quando configurar um
      # Gerado UMA vez e compartilhado identico entre web e os cron jobs -
      # por isso fica no grupo (generateValue e permitido aqui, sync:false nao).
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PLATFORM_COMMISSION_PERCENT
        value: "30"
      - key: WALLET_RELEASE_DAYS_AFTER_SHIPPING
        value: "3"
      - key: DELIVERY_CONFIRMATION_WINDOW_HOURS
        value: "24"
      - key: PACKAGING_FEE
        value: "3.90"
      - key: SHIPPING_PROVIDER
        value: "melhor_envio"
      - key: MELHOR_ENVIO_SANDBOX
        value: "False"
      - key: PAYMENT_PROVIDER
        value: "asaas"
      - key: ASAAS_API_URL
        value: "https://api.asaas.com/v3"
      - key: AGE_KYC_PROVIDER
        value: "idwall"
      - key: NFSE_PROVIDER_URL
        value: "https://api.focusnfe.com.br/v2/nfse"
      - key: AWS_S3_SIGNED_URL_EXPIRE_SECONDS
        value: "300"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "Renda & Renda <no-reply@rendaerenda.com.br>"

# Sem bloco `databases:` de proposito: usamos um Postgres premium que ja
# existe em producao (fora deste blueprint), em vez de deixar o Render
# provisionar um banco novo pelo blueprint (que ficaria preso no plano
# `starter`, indisponivel na conta). DATABASE_URL e preenchido manualmente
# em cada servico abaixo (ver nota no `sync: false` correspondente) - cole
# a "Internal Database URL" do banco existente (mais rapido/sem custo de
# bandwidth do que a "External Database URL", já que web/cron rodam
# dentro do proprio Render).

services:
  - type: web
    name: rendaerenda-web
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    healthCheckPath: /healthz/
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        sync: false
      - key: SITE_DOMAIN
        sync: false
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: AGE_KYC_API_KEY
        sync: false
      - key: PHONE_CPF_BUREAU_URL
        sync: false
      - key: PHONE_CPF_BUREAU_API_KEY
        sync: false
      - key: SMS_PROVIDER_URL
        sync: false
      - key: SMS_PROVIDER_API_KEY
        sync: false
      - key: NFSE_PROVIDER_API_KEY
        sync: false
      - key: PLATFORM_LEGAL_NAME
        sync: false
      - key: PLATFORM_CNPJ
        sync: false
      - key: PLATFORM_MUNICIPAL_SERVICE_CODE
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: CORREIOS_CWS_USER
        sync: false
      - key: CORREIOS_CWS_PASSWORD
        sync: false
      - key: CORREIOS_CONTRACT_NUMBER
        sync: false
      - key: CORREIOS_CARD_NUMBER
        sync: false
      - key: CORREIOS_ORIGIN_CEP
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

# Cron Jobs (rastreio de envio + liberacao de saldo) removidos deste
# blueprint em modo teste pra custo ficar $0. Antes de ir ao ar, adicionar
# de volta 2 servicos `type: cron` chamando `python manage.py poll_shipments`
# (schedule "0 * * * *") e `python manage.py release_deliveries` (schedule
# "*/30 * * * *") - ver commit "Corrigir CSP do Alpine.js e reduzir custo
# de hospedagem no Render" no historico do git pro YAML completo.
