# Blueprint de deploy no Render (https://render.com/docs/blueprint-spec).
#
# PRODUCAO — rendaerenda.com.br (modelo intermediario simples)
# Sobe: Postgres + Web + 2 Cron Jobs.
#
# Variaveis sync:false = essenciais: Asaas + Melhor Envio + e-mail.
# Fotos ficam no disco persistente do web (/var/data) — sem AWS.
#
# Como usar:
#   1. Push deste arquivo.
#   2. Render → New → Blueprint → Apply.
#   3. Preencha as poucas chaves pedidas (ou deixe em branco e complete depois).
#   4. Hostinger DNS: A @ → 216.24.57.1 ; CNAME www → rendaerenda-web.onrender.com

databases:
  - name: rendaerenda-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: rendaerenda
    user: rendaerenda
    ipAllowList: []

envVarGroups:
  - name: rendaerenda-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "rendaerenda.com.br,www.rendaerenda.com.br,.onrender.com"
      - key: SITE_NAME
        value: "Renda & Renda"
      - key: SITE_DOMAIN
        value: "rendaerenda.com.br"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://rendaerenda.com.br,https://www.rendaerenda.com.br"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PLATFORM_COMMISSION_PERCENT
        value: "15"
      - key: PACKAGING_FEE
        value: "0"
      - key: CHECKOUT_FREE_SHIPPING
        value: "True"
      # Tempo que o pedido segura o estoque esperando o Pix (min).
      - key: ORDER_PAYMENT_TTL_MINUTES
        value: "60"
      # Validade da cobranca Pix no Asaas (dias). 0 faria o QR morrer a meia-noite.
      - key: PIX_DUE_DAYS
        value: "3"
      # Pix pago por CPF diferente do titular do pedido: estorno automatico
      # (trava de idade). Deixe True enquanto a verificacao biometrica nao
      # estiver ligada.
      - key: REFUND_ON_PAYER_CPF_MISMATCH
        value: "True"
      # --- Custodia: o dinheiro fica com a plataforma ate a entrega ---
      - key: ESCROW_ENABLED
        value: "True"
      # Repasse imediato so existe com ESCROW_ENABLED=False.
      - key: AUTO_PAYOUT_ON_PAYMENT
        value: "False"
      - key: AUTO_PAYOUT_ON_RELEASE
        value: "True"
      # Prazo do comprador para contestar depois de receber (dias).
      - key: DISPUTE_WINDOW_DAYS
        value: "7"
      # Conteudo digital nao tem entrega para rastrear: libera por prazo (h).
      - key: DIGITAL_RELEASE_HOURS
        value: "24"
      # Teto de retencao — o valor nunca fica preso para sempre (dias).
      - key: ESCROW_MAX_HOLD_DAYS
        value: "30"
      - key: REQUIRE_SELLER_KYC
        value: "False"
      - key: WALLET_RELEASE_DAYS_AFTER_SHIPPING
        value: "0"
      - key: DELIVERY_CONFIRMATION_WINDOW_HOURS
        value: "24"
      - key: SHIPPING_PROVIDER
        value: "melhor_envio"
      - key: MELHOR_ENVIO_SANDBOX
        value: "False"
      - key: PAYMENT_PROVIDER
        value: "asaas"
      - key: ASAAS_API_URL
        value: "https://api.asaas.com/v3"
      # pf = sem split (repasse Pix); trocar para "pj" quando tiver CNPJ + subcontas
      - key: ASAAS_ACCOUNT_TYPE
        value: "pf"
      # EMAIL_BACKEND: omitido — settings escolhe SMTP só se EMAIL_HOST+USER
      # estiverem preenchidos; senao console (evita 500 no cadastro).
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "Renda & Renda <no-reply@rendaerenda.com.br>"
      - key: MEDIA_ROOT
        value: "/var/data/media"
      # Cria loja teste com 3 itens a R$ 5 em todo deploy (idempotente).
      - key: SEED_PAYMENT_TEST
        value: "True"

services:
  - type: web
    name: rendaerenda-web
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    healthCheckPath: /healthz/
    # Disco persistente pras fotos (sobrevive a redeploy). Cobra ~US$0.25/GB/mes.
    disk:
      name: rendaerenda-media
      mountPath: /var/data
      sizeGB: 5
    domains:
      - rendaerenda.com.br
      - www.rendaerenda.com.br
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      # --- Essenciais ---
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Pix da loja teste (CPF/e-mail/telefone/EVP). Sem isso o checkout bloqueia.
      - key: PIX_TEST_KEY
        sync: false

  - type: cron
    name: rendaerenda-poll-shipments
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py poll_shipments"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      - key: MELHOR_ENVIO_TOKEN
        sync: false

  # Confere no Asaas os Pix pendentes (rede de seguranca caso o webhook
  # falhe) e devolve para a vitrine o estoque de pedido nao pago.
  - type: cron
    name: rendaerenda-expire-orders
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "*/10 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py expire_orders"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      - key: ASAAS_API_KEY
        sync: false

  - type: cron
    name: rendaerenda-release-deliveries
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "*/30 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py release_deliveries"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      - key: ASAAS_API_KEY
        sync: false

  # Repassa por Pix o que ja saiu da custodia (conteudo digital e casos
  # em que o repasse falhou na hora da liberacao).
  - type: cron
    name: rendaerenda-release-escrow
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "*/30 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py release_escrow"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      - key: ASAAS_API_KEY
        sync: false

  # Digest semanal de novidades (segundas 14:00 UTC ≈ 11:00 BRT).
  - type: cron
    name: rendaerenda-marketing-digest
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "0 14 * * 1"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py send_marketing_digest --days=7"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
