# Blueprint de deploy no Render (https://render.com/docs/blueprint-spec).
#
# PRODUCAO — rendaerenda.com.br
# Sobe: Postgres + Web (Django/gunicorn) + 2 Cron Jobs.
# Sem Redis e sem worker Celery 24/7 (tasks assincronas rodam no gunicorn
# via CELERY_TASK_ALWAYS_EAGER — ver config/settings.py). Cron cobra por
# segundo de execucao (centavos/mes).
#
# Como usar:
#   1. Commit e push deste arquivo.
#   2. Render Dashboard → New → Blueprint → selecione o repositorio.
#   3. Preencha as variaveis sync:false (segredos) quando o Render pedir.
#   4. Na Hostinger, aponte o DNS (A @ → 216.24.57.1 ; CNAME www →
#      rendaerenda-web.onrender.com). Ver instrucoes no chat / README.
#   5. Shell do web → python manage.py createsuperuser
#
# Custo aproximado: Web Starter (~US$7) + Postgres basic-256mb (~US$7) +
# crons (centavos). NAO use plano free em producao (dorme + webhook quebra).
#
# IMPORTANTE envVarGroups: so literais ou generateValue. Segredos (sync:false)
# e fromDatabase ficam repetidos em cada servico que precisa deles.

databases:
  - name: rendaerenda-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    databaseName: rendaerenda
    user: rendaerenda
    ipAllowList: [] # so rede interna do Render (web/cron)

envVarGroups:
  - name: rendaerenda-shared
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "rendaerenda.com.br,www.rendaerenda.com.br,.onrender.com"
      - key: SITE_NAME
        value: "Renda & Renda"
      - key: SITE_DOMAIN
        value: "rendaerenda.com.br"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://rendaerenda.com.br,https://www.rendaerenda.com.br"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PLATFORM_COMMISSION_PERCENT
        value: "30"
      - key: WALLET_RELEASE_DAYS_AFTER_SHIPPING
        value: "3"
      - key: DELIVERY_CONFIRMATION_WINDOW_HOURS
        value: "24"
      - key: PACKAGING_FEE
        value: "3.90"
      - key: SHIPPING_PROVIDER
        value: "melhor_envio"
      - key: MELHOR_ENVIO_SANDBOX
        value: "False"
      - key: PAYMENT_PROVIDER
        value: "asaas"
      - key: ASAAS_API_URL
        value: "https://api.asaas.com/v3"
      - key: AGE_KYC_PROVIDER
        value: "idwall"
      - key: NFSE_PROVIDER_URL
        value: "https://api.focusnfe.com.br/v2/nfse"
      - key: AWS_S3_SIGNED_URL_EXPIRE_SECONDS
        value: "300"
      - key: EMAIL_BACKEND
        value: "django.core.mail.backends.smtp.EmailBackend"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        value: "Renda & Renda <no-reply@rendaerenda.com.br>"

services:
  - type: web
    name: rendaerenda-web
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 60"
    healthCheckPath: /healthz/
    domains:
      - rendaerenda.com.br
      - www.rendaerenda.com.br
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: AGE_KYC_API_KEY
        sync: false
      - key: PHONE_CPF_BUREAU_URL
        sync: false
      - key: PHONE_CPF_BUREAU_API_KEY
        sync: false
      - key: SMS_PROVIDER_URL
        sync: false
      - key: SMS_PROVIDER_API_KEY
        sync: false
      - key: NFSE_PROVIDER_API_KEY
        sync: false
      - key: PLATFORM_LEGAL_NAME
        sync: false
      - key: PLATFORM_CNPJ
        sync: false
      - key: PLATFORM_MUNICIPAL_SERVICE_CODE
        sync: false
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: CORREIOS_CWS_USER
        sync: false
      - key: CORREIOS_CWS_PASSWORD
        sync: false
      - key: CORREIOS_CONTRACT_NUMBER
        sync: false
      - key: CORREIOS_CARD_NUMBER
        sync: false
      - key: CORREIOS_ORIGIN_CEP
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false

  # Rastreio de envios (Melhor Envio / Correios) — a cada hora
  - type: cron
    name: rendaerenda-poll-shipments
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "0 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py poll_shipments"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
      - key: MELHOR_ENVIO_TOKEN
        sync: false
      - key: CORREIOS_CWS_USER
        sync: false
      - key: CORREIOS_CWS_PASSWORD
        sync: false
      - key: CORREIOS_CONTRACT_NUMBER
        sync: false
      - key: CORREIOS_CARD_NUMBER
        sync: false
      - key: CORREIOS_ORIGIN_CEP
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false

  # Libera saldo apos confirmacao de entrega — a cada 30 min
  - type: cron
    name: rendaerenda-release-deliveries
    runtime: python
    region: oregon
    plan: starter
    rootDir: backend
    schedule: "*/30 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python manage.py release_deliveries"
    envVars:
      - fromGroup: rendaerenda-shared
      - key: DATABASE_URL
        fromDatabase:
          name: rendaerenda-db
          property: connectionString
